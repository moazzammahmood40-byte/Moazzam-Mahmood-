<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="aquaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07131b" />
      <stop offset="100%" stop-color="#0a2030" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="pureWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#aquaBg)" />

  <!-- Flow Wave Lines Pattern -->
  <g opacity="0.06" stroke="#00f2fe" stroke-width="1.5" fill="none">
    <path d="M0,120 Q200,90 400,120 T800,120" />
    <path d="M0,220 Q200,190 400,220 T800,220" />
    <path d="M0,320 Q200,290 400,320 T800,320" />
    <path d="M0,420 Q200,390 400,420 T800,420" />
  </g>

  <!-- Ambient Light -->
  <circle cx="650" cy="160" r="150" fill="#00f2fe" opacity="0.08" filter="url(#cyanGlow)" />
  <circle cx="180" cy="360" r="130" fill="#38bdf8" opacity="0.05" filter="url(#cyanGlow)" />

  <!-- Browser Frame -->
  <rect x="60" y="50" width="680" height="400" rx="14" fill="#0a1622" stroke="#00f2fe" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Header Bar -->
  <rect x="60" y="50" width="680" height="42" rx="14" fill="#0d1d2d" />
  <rect x="60" y="78" width="680" height="14" fill="#0d1d2d" />
  <circle cx="86" cy="71" r="5" fill="#f43f5e" opacity="0.8" />
  <circle cx="104" cy="71" r="5" fill="#fbbf24" opacity="0.8" />
  <circle cx="122" cy="71" r="5" fill="#10b981" opacity="0.8" />

  <!-- URL Bar -->
  <rect x="160" y="60" width="480" height="22" rx="6" fill="#061019" stroke="#00f2fe" stroke-opacity="0.12" stroke-width="1" />
  <text x="180" y="75" font-family="'Inter', sans-serif" font-size="11" fill="#7dd3fc" letter-spacing="0.5">https://aquanixwaterfilter.com</text>
  <circle cx="625" cy="71" r="3" fill="#00f2fe" />

  <!-- Site Content -->
  <g transform="translate(60, 92)">
    <!-- Site Logo -->
    <circle cx="44" cy="34" r="14" fill="url(#cyanAccent)" />
    <!-- Droplet icon inside logo -->
    <path d="M44,25 C44,25 38,32 38,36 C38,39.3 40.7,42 44,42 C47.3,42 50,39.3 50,36 C50,32 44,25 44,25 Z" fill="#061019" />
    <text x="68" y="38" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="1">AQUANIX <tspan fill="#00f2fe">FILTER</tspan></text>

    <!-- Nav -->
    <text x="440" y="37" font-family="'Inter', sans-serif" font-size="11" fill="#93c5fd" font-weight="500">Purifiers</text>
    <text x="505" y="37" font-family="'Inter', sans-serif" font-size="11" fill="#93c5fd" font-weight="500">Technology</text>
    <text x="585" y="37" font-family="'Inter', sans-serif" font-size="11" fill="#93c5fd" font-weight="500">Inquire</text>

    <!-- Hero Content Left -->
    <rect x="30" y="75" width="135" height="18" rx="9" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <text x="42" y="87" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#38bdf8" letter-spacing="0.8">PURE HYDRATION TECH</text>

    <text x="30" y="130" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#ffffff">Smart Multi-Stage</text>
    <text x="30" y="165" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="url(#cyanAccent)">Water Purification</text>

    <text x="30" y="195" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Advanced RO + UV filtration designed for commercial and home health.</text>

    <!-- CTAs -->
    <rect x="30" y="220" width="130" height="36" rx="8" fill="url(#cyanAccent)" />
    <text x="52" y="242" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#07131b">Explore Models</text>

    <rect x="175" y="220" width="115" height="36" rx="8" fill="#0f2438" stroke="#00f2fe" stroke-opacity="0.2" stroke-width="1" />
    <text x="198" y="242" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#93c5fd">Request Quote</text>

    <!-- Right Side Filtration Unit Mockup -->
    <rect x="390" y="75" width="260" height="185" rx="12" fill="#0c1d2e" stroke="#00f2fe" stroke-opacity="0.15" stroke-width="1" />
    
    <!-- Water Tank / Filter Cylinders -->
    <g transform="translate(420, 95)">
      <!-- Cylinder 1 -->
      <rect x="15" y="15" width="45" height="90" rx="8" fill="#06111a" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
      <rect x="20" y="45" width="35" height="55" rx="4" fill="url(#pureWater)" opacity="0.6" />
      <text x="24" y="32" font-family="'Inter', sans-serif" font-size="8" fill="#38bdf8" font-weight="700">STAGE 1</text>
      <!-- Cylinder 2 -->
      <rect x="75" y="15" width="45" height="90" rx="8" fill="#06111a" stroke="#00f2fe" stroke-opacity="0.6" stroke-width="1.2" />
      <rect x="80" y="35" width="35" height="65" rx="4" fill="url(#pureWater)" opacity="0.8" />
      <text x="84" y="32" font-family="'Inter', sans-serif" font-size="8" fill="#00f2fe" font-weight="700">RO MEM</text>
      <!-- Cylinder 3 -->
      <rect x="135" y="15" width="45" height="90" rx="8" fill="#06111a" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
      <rect x="140" y="55" width="35" height="45" rx="4" fill="url(#pureWater)" opacity="0.7" />
      <text x="145" y="32" font-family="'Inter', sans-serif" font-size="8" fill="#38bdf8" font-weight="700">UV STER</text>
    </g>

    <text x="415" y="222" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff">99.9% TDS Reduction System</text>
    <text x="415" y="238" font-family="'Inter', sans-serif" font-size="10" fill="#7dd3fc">NSF Certified Filtration Standard</text>

    <!-- Bottom Stat Strip -->
    <rect x="30" y="280" width="620" height="50" rx="8" fill="#091826" stroke="#00f2fe" stroke-opacity="0.1" stroke-width="1" />
    <text x="50" y="310" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#00f2fe">7-Stage</text>
    <text x="105" y="310" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Active Purification</text>
    <text x="250" y="310" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">0.0001 µm</text>
    <text x="325" y="310" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Pore Precision</text>
    <text x="460" y="310" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10b981">100%</text>
    <text x="505" y="310" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Mineral Balance</text>
  </g>
</svg>
