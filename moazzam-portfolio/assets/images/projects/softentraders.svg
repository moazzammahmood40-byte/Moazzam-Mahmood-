<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="tradeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="100%" stop-color="#101728" />
    </linearGradient>
    <linearGradient id="blueTrade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="amberTrade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="tradeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#tradeBg)" />

  <!-- Global Route Lines Pattern -->
  <g opacity="0.07" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 4" fill="none">
    <path d="M50,150 Q400,50 750,200" />
    <path d="M50,300 Q400,200 750,350" />
    <circle cx="200" cy="115" r="4" fill="#3b82f6" />
    <circle cx="580" cy="130" r="4" fill="#f59e0b" />
    <circle cx="380" cy="245" r="4" fill="#60a5fa" />
  </g>

  <!-- Ambient Light -->
  <circle cx="650" cy="180" r="140" fill="#3b82f6" opacity="0.08" filter="url(#tradeGlow)" />
  <circle cx="170" cy="360" r="130" fill="#f59e0b" opacity="0.04" filter="url(#tradeGlow)" />

  <!-- Browser Frame -->
  <rect x="60" y="50" width="680" height="400" rx="14" fill="#0d1322" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Header Bar -->
  <rect x="60" y="50" width="680" height="42" rx="14" fill="#121a2f" />
  <rect x="60" y="78" width="680" height="14" fill="#121a2f" />
  <circle cx="86" cy="71" r="5" fill="#f43f5e" opacity="0.8" />
  <circle cx="104" cy="71" r="5" fill="#fbbf24" opacity="0.8" />
  <circle cx="122" cy="71" r="5" fill="#10b981" opacity="0.8" />

  <!-- URL Bar -->
  <rect x="160" y="60" width="480" height="22" rx="6" fill="#090e1a" stroke="#3b82f6" stroke-opacity="0.12" stroke-width="1" />
  <text x="180" y="75" font-family="'Inter', sans-serif" font-size="11" fill="#93c5fd" letter-spacing="0.5">https://softentraders.com</text>
  <circle cx="625" cy="71" r="3" fill="#3b82f6" />

  <!-- Site Content -->
  <g transform="translate(60, 92)">
    <!-- Site Logo -->
    <rect x="30" y="20" width="28" height="28" rx="6" fill="url(#blueTrade)" />
    <!-- Trading Arrows inside logo -->
    <path d="M36,36 L44,28 L52,36" stroke="#0a0d18" stroke-width="2" fill="none" />
    <path d="M44,28 L44,42" stroke="#0a0d18" stroke-width="2" />
    <text x="68" y="38" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="1">SOFTEN <tspan fill="#60a5fa">TRADERS</tspan></text>

    <!-- Nav -->
    <text x="440" y="37" font-family="'Inter', sans-serif" font-size="11" fill="#bfdbfe" font-weight="500">Commodities</text>
    <text x="525" y="37" font-family="'Inter', sans-serif" font-size="11" fill="#bfdbfe" font-weight="500">Logistics</text>
    <text x="590" y="37" font-family="'Inter', sans-serif" font-size="11" fill="#bfdbfe" font-weight="500">Portal</text>

    <!-- Hero Content Left -->
    <rect x="30" y="75" width="130" height="18" rx="9" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1" />
    <text x="42" y="87" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#60a5fa" letter-spacing="0.8">GLOBAL B2B COMMERCE</text>

    <text x="30" y="130" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#ffffff">Enterprise Supply &amp;</text>
    <text x="30" y="165" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="url(#amberTrade)">Trading Network</text>

    <text x="30" y="195" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Cross-border procurement, bulk distribution, and verified logistics.</text>

    <!-- CTAs -->
    <rect x="30" y="220" width="130" height="36" rx="8" fill="url(#blueTrade)" />
    <text x="50" y="242" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#0a0d18">Trade Catalogue</text>

    <rect x="175" y="220" width="115" height="36" rx="8" fill="#131e36" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1" />
    <text x="195" y="242" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#93c5fd">B2B Quotation</text>

    <!-- Right Side Trading Metrics -->
    <rect x="390" y="75" width="260" height="185" rx="12" fill="#10192e" stroke="#3b82f6" stroke-opacity="0.12" stroke-width="1" />
    
    <!-- Table Mockup -->
    <g transform="translate(405, 90)">
      <rect x="10" y="10" width="220" height="24" rx="4" fill="#0a1020" />
      <text x="20" y="26" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" font-weight="600">SECTOR</text>
      <text x="110" y="26" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" font-weight="600">STATUS</text>
      <text x="175" y="26" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" font-weight="600">FLOW</text>

      <!-- Row 1 -->
      <rect x="10" y="38" width="220" height="24" rx="4" fill="#131e36" />
      <text x="20" y="54" font-family="'Inter', sans-serif" font-size="9" fill="#ffffff">Raw Polymers</text>
      <text x="110" y="54" font-family="'Inter', sans-serif" font-size="9" fill="#10b981" font-weight="600">Active</text>
      <text x="175" y="54" font-family="'Inter', sans-serif" font-size="9" fill="#60a5fa">+18.4%</text>

      <!-- Row 2 -->
      <rect x="10" y="66" width="220" height="24" rx="4" fill="#0e172a" />
      <text x="20" y="82" font-family="'Inter', sans-serif" font-size="9" fill="#ffffff">Metals &amp; Ore</text>
      <text x="110" y="82" font-family="'Inter', sans-serif" font-size="9" fill="#10b981" font-weight="600">Active</text>
      <text x="175" y="82" font-family="'Inter', sans-serif" font-size="9" fill="#60a5fa">+12.1%</text>

      <!-- Row 3 -->
      <rect x="10" y="94" width="220" height="24" rx="4" fill="#131e36" />
      <text x="20" y="110" font-family="'Inter', sans-serif" font-size="9" fill="#ffffff">Industrial Parts</text>
      <text x="110" y="110" font-family="'Inter', sans-serif" font-size="9" fill="#fbbf24" font-weight="600">Queued</text>
      <text x="175" y="110" font-family="'Inter', sans-serif" font-size="9" fill="#fbbf24">+8.6%</text>

      <text x="10" y="142" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#ffffff">Global Commercial Dispatch</text>
      <text x="10" y="156" font-family="'Inter', sans-serif" font-size="9" fill="#93c5fd">Real-time supply chain integration</text>
    </g>

    <!-- Bottom Stat Strip -->
    <rect x="30" y="280" width="620" height="50" rx="8" fill="#0c1426" stroke="#3b82f6" stroke-opacity="0.1" stroke-width="1" />
    <text x="50" y="310" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#3b82f6">B2B</text>
    <text x="85" y="310" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Enterprise Tier</text>
    <text x="220" y="310" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Multi-Hub</text>
    <text x="285" y="310" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Logistics Network</text>
    <text x="440" y="310" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10b981">Verified</text>
    <text x="495" y="310" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Trading Compliance</text>
  </g>
</svg>
