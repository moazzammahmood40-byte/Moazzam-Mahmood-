<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="craftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1110" />
      <stop offset="100%" stop-color="#121d1b" />
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="goldCraft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#craftBg)" />

  <!-- Geometric Diamond Lattice Pattern -->
  <g opacity="0.06" stroke="#10b981" stroke-width="1" fill="none">
    <polygon points="100,50 150,100 100,150 50,100" />
    <polygon points="300,50 350,100 300,150 250,100" />
    <polygon points="500,50 550,100 500,150 450,100" />
    <polygon points="700,50 750,100 700,150 650,100" />
    <polygon points="200,150 250,200 200,250 150,200" />
    <polygon points="400,150 450,200 400,250 350,200" />
    <polygon points="600,150 650,200 600,250 550,200" />
  </g>

  <!-- Ambient Light -->
  <circle cx="640" cy="170" r="140" fill="#10b981" opacity="0.08" filter="url(#emeraldGlow)" />
  <circle cx="160" cy="380" r="140" fill="#fbbf24" opacity="0.05" filter="url(#emeraldGlow)" />

  <!-- Browser Frame -->
  <rect x="60" y="50" width="680" height="400" rx="14" fill="#0f1917" stroke="#10b981" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Header Bar -->
  <rect x="60" y="50" width="680" height="42" rx="14" fill="#13211e" />
  <rect x="60" y="78" width="680" height="14" fill="#13211e" />
  <circle cx="86" cy="71" r="5" fill="#f43f5e" opacity="0.8" />
  <circle cx="104" cy="71" r="5" fill="#fbbf24" opacity="0.8" />
  <circle cx="122" cy="71" r="5" fill="#10b981" opacity="0.8" />

  <!-- URL Bar -->
  <rect x="160" y="60" width="480" height="22" rx="6" fill="#09100f" stroke="#10b981" stroke-opacity="0.12" stroke-width="1" />
  <text x="180" y="75" font-family="'Inter', sans-serif" font-size="11" fill="#6ee7b7" letter-spacing="0.5">https://malvincraft.com</text>
  <circle cx="625" cy="71" r="3" fill="#10b981" />

  <!-- Site Content -->
  <g transform="translate(60, 92)">
    <!-- Site Logo -->
    <rect x="30" y="20" width="28" height="28" rx="6" fill="url(#emeraldAccent)" />
    <text x="38" y="40" font-family="'Inter', sans-serif" font-weight="900" font-size="18" fill="#0b1110">M</text>
    <text x="68" y="38" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="2">MALVIN <tspan fill="#34d399">CRAFT</tspan></text>

    <!-- Nav -->
    <text x="440" y="37" font-family="'Inter', sans-serif" font-size="11" fill="#a7f3d0" font-weight="500">Collection</text>
    <text x="515" y="37" font-family="'Inter', sans-serif" font-size="11" fill="#a7f3d0" font-weight="500">Atelier</text>
    <text x="575" y="37" font-family="'Inter', sans-serif" font-size="11" fill="#a7f3d0" font-weight="500">Bespeak</text>

    <!-- Hero Content Left -->
    <rect x="30" y="75" width="130" height="18" rx="9" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="42" y="87" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#34d399" letter-spacing="0.8">ARTISANAL HERITAGE</text>

    <text x="30" y="130" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#ffffff">Handcrafted Form,</text>
    <text x="30" y="165" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="url(#goldCraft)">Timeless Design</text>

    <text x="30" y="195" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Bespoke artifacts and luxury crafted materials for modern interiors.</text>

    <!-- CTAs -->
    <rect x="30" y="220" width="130" height="36" rx="8" fill="url(#emeraldAccent)" />
    <text x="52" y="242" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#0b1110">View Catalogue</text>

    <rect x="175" y="220" width="115" height="36" rx="8" fill="#142622" stroke="#10b981" stroke-opacity="0.2" stroke-width="1" />
    <text x="200" y="242" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#6ee7b7">Custom Order</text>

    <!-- Right Side Showcase Grid -->
    <rect x="390" y="75" width="260" height="185" rx="12" fill="#111f1c" stroke="#10b981" stroke-opacity="0.12" stroke-width="1" />
    
    <!-- Mini Gallery Cards -->
    <g transform="translate(405, 90)">
      <rect x="10" y="10" width="105" height="65" rx="6" fill="#0c1715" stroke="#10b981" stroke-opacity="0.2" />
      <circle cx="62" cy="42" r="18" fill="url(#goldCraft)" opacity="0.7" />
      <text x="32" y="68" font-family="'Inter', sans-serif" font-size="7" fill="#fbbf24" font-weight="700">CERAMIC VESSEL</text>

      <rect x="125" y="10" width="105" height="65" rx="6" fill="#0c1715" stroke="#10b981" stroke-opacity="0.2" />
      <rect x="155" y="25" width="45" height="35" rx="4" fill="url(#emeraldAccent)" opacity="0.6" />
      <text x="148" y="68" font-family="'Inter', sans-serif" font-size="7" fill="#34d399" font-weight="700">WALNUT SCULPT</text>

      <text x="10" y="105" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff">The 2026 Crafted Series</text>
      <text x="10" y="122" font-family="'Inter', sans-serif" font-size="10" fill="#a7f3d0">Ethically sourced materials &amp; hand finishing</text>
    </g>

    <!-- Bottom Stat Strip -->
    <rect x="30" y="280" width="620" height="50" rx="8" fill="#0d1816" stroke="#10b981" stroke-opacity="0.1" stroke-width="1" />
    <text x="50" y="310" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10b981">100%</text>
    <text x="95" y="310" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Bespoke Origin</text>
    <text x="240" y="310" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Handmade</text>
    <text x="315" y="310" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Master Artisan Standard</text>
    <text x="470" y="310" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#34d399">Global</text>
    <text x="520" y="310" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Boutique Delivery</text>
  </g>
</svg>
